title: Local LLM + Claude Code Guide
description: Step-by-step guide to running Qwen 3.6 + Gemma 4 locally, with Claude Code talking to them over SSH.

remote_theme: just-the-docs/just-the-docs

url: https://jaloliddin-rus.github.io
baseurl: /local-llm-claude-code-guide

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Navigation
heading_anchors: true

# Search across the whole guide
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Copy-to-clipboard button on every code block
enable_copy_code_button: true

# Color scheme (users can toggle in UI if both are enabled)
color_scheme: light

# GitHub link in the top-right
aux_links:
  "View on GitHub":
    - "https://github.com/jaloliddin-rus/local-llm-claude-code-guide"
aux_links_new_tab: true

# Footer
footer_content: 'Source on <a href="https://github.com/jaloliddin-rus/local-llm-claude-code-guide">GitHub</a>. Content © Jaloliddin.'

# Back-to-top link
back_to_top: true
back_to_top_text: "Back to top"

# Don't index these files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
